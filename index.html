<meta charset="utf-8">
<title>DataGrid 数据生产引擎</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:#F1F3F2; --surface:#FFFFFF; --surface-2:#F7F9F8;
    --line:#DCE2E0; --line-soft:#E7ECEA;
    --fg:#101A1C; --fg-2:#4D5D5B; --fg-3:#7C8C8A;
    --accent:#0E8F9E; --accent-ink:#0A6B77; --accent-wash:rgba(14,143,158,.09);
    --amber:#A76A14;
    --nav:#0B1315; --nav-fg:#E9F1EF; --nav-fg-2:#93A8A6; --nav-line:#1C2A2C;
    --panel:#0A1214; --plate:#FFFFFF;
    --shadow:0 1px 2px rgba(12,25,27,.05), 0 8px 24px rgba(12,25,27,.06);
    --font-display:'Archivo','Noto Sans SC',system-ui,-apple-system,sans-serif;
    --font-body:'Noto Sans SC','Archivo',system-ui,-apple-system,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0A1012; --surface:#111A1C; --surface-2:#0D1618;
      --line:#233032; --line-soft:#1A2527;
      --fg:#E6EDEB; --fg-2:#9FAFAD; --fg-3:#788886;
      --accent:#3FC3D4; --accent-ink:#8CE2EE; --accent-wash:rgba(63,195,212,.12);
      --amber:#E2B063;
      --nav:#070C0E; --nav-line:#1A2628;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0A1012; --surface:#111A1C; --surface-2:#0D1618;
    --line:#233032; --line-soft:#1A2527;
    --fg:#E6EDEB; --fg-2:#9FAFAD; --fg-3:#788886;
    --accent:#3FC3D4; --accent-ink:#8CE2EE; --accent-wash:rgba(63,195,212,.12);
    --amber:#E2B063;
    --nav:#070C0E; --nav-line:#1A2628;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  body{background:var(--paper); color:var(--fg); font-family:var(--font-body); font-size:15px; line-height:1.75; -webkit-font-smoothing:antialiased}
  h1,h2,h3,h4,h5{font-family:var(--font-display); font-weight:700; line-height:1.22; letter-spacing:-.015em; text-wrap:balance; margin:0}
  p{margin:0}
  a{color:inherit}
  button{font:inherit; color:inherit; background:none; border:0; margin:0; padding:0}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
  .wrap{width:100%; max-width:1180px; margin-inline:auto; padding-inline:24px}
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums}
  .eyebrow{font-family:var(--font-mono); font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent)}

  /* ---------- top bar ---------- */
  .topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:60; background:var(--nav); border-bottom:1px solid var(--nav-line)}
  .topbar .wrap{display:flex; align-items:center; gap:22px; padding-block:12px; flex-wrap:wrap}
  .brand{display:flex; align-items:center; gap:10px; color:#fff; font-family:var(--font-display); font-weight:700; font-size:17px; letter-spacing:-.02em; text-decoration:none}
  .brand small{font-family:var(--font-mono); font-weight:400; font-size:11px; letter-spacing:.08em; color:var(--nav-fg-2); padding-left:10px; border-left:1px solid var(--nav-line)}
  .tabs{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap; text-decoration:none; font-size:14px; font-weight:500; color:var(--nav-fg-2); padding:7px 13px; border-radius:7px; border:1px solid transparent; cursor:pointer; transition:color .15s, background .15s}
  .tab:hover{color:var(--nav-fg)}
  .tab[aria-selected="true"]{color:#9EE9F4; background:rgba(63,195,212,.13); border-color:rgba(63,195,212,.28)}
  .bar-spacer{flex:1}
  .cta{font-size:13.5px; font-weight:500; color:#06171A; background:#8FE3EE; padding:8px 15px; border-radius:7px; text-decoration:none; white-space:nowrap}
  .cta:hover{background:#A8ECF5}
  @media (max-width:820px){
    .topbar .wrap{gap:12px}
    .bar-spacer{display:none}
    .tabs{order:3; width:100%; padding-bottom:2px}
    .cta{margin-left:auto}
  }

  /* ---------- masthead ---------- */
  .masthead{position:relative; background:var(--nav); color:var(--nav-fg); overflow:hidden}
  .masthead::before{content:""; position:absolute; inset:0;
    background-image:linear-gradient(rgba(63,195,212,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(63,195,212,.13) 1px,transparent 1px);
    background-size:34px 34px;
    -webkit-mask-image:radial-gradient(120% 90% at 82% 0%, #000 0%, transparent 68%);
    mask-image:radial-gradient(120% 90% at 82% 0%, #000 0%, transparent 68%)}
  .masthead .wrap{position:relative; padding-block:52px 0}
  .masthead h1{font-size:clamp(30px,5.2vw,50px); color:#fff; margin-top:14px; max-width:19ch}
  .masthead .lead{margin-top:16px; max-width:62ch; color:var(--nav-fg-2); font-size:15.5px}
  .stats{display:grid; grid-template-columns:repeat(4,1fr); margin-top:40px; border-top:1px solid var(--nav-line)}
  .stat{padding:18px 20px 22px; border-right:1px solid var(--nav-line)}
  .stat:first-child{padding-left:0}
  .stat:last-child{border-right:0}
  .stat .v{font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:clamp(20px,3vw,27px); color:#fff; letter-spacing:-.02em}
  .stat .v em{font-style:normal; font-size:.6em; color:#8FE3EE; padding-left:3px}
  .stat .k{font-size:12.5px; color:var(--nav-fg-2); margin-top:2px}
  @media (max-width:700px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .stat{border-bottom:1px solid var(--nav-line); padding-inline:0 16px}
    .stat:nth-child(2n){border-right:0}
    .stat:nth-child(n+3){border-bottom:0}
  }

  /* ---------- tab intro ---------- */
  .intro{padding-block:46px 6px}
  .intro h2{font-size:clamp(25px,3.6vw,34px); margin-top:12px}
  .intro .lead{margin-top:14px; max-width:66ch; color:var(--fg-2); font-size:16px}

  /* ---------- sections ---------- */
  .section{padding-block:34px}
  .sec-head{display:flex; align-items:baseline; gap:14px; margin-bottom:6px}
  .sec-head h3{font-size:19px}
  .sec-head .rule{flex:1; height:1px; background:var(--line)}
  .sec-head .count{font-family:var(--font-mono); font-size:11.5px; color:var(--fg-3)}
  .sec-desc{color:var(--fg-2); font-size:14.5px; max-width:70ch; margin-bottom:22px}

  .grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px}
  .grid.even{grid-template-columns:repeat(2,minmax(0,1fr))}
  @media (max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:640px){.grid,.grid.even{grid-template-columns:1fr}}
  .card,.spot{display:flex; text-align:start; background:var(--surface); border:1px solid var(--line); border-radius:11px; overflow:hidden; cursor:pointer; width:100%;
    transition:border-color .18s ease, transform .18s ease, box-shadow .18s ease}
  .card{flex-direction:column}
  .card:hover,.spot:hover{border-color:var(--accent); transform:translateY(-2px); box-shadow:var(--shadow)}
  .viz{background:var(--panel); border-bottom:1px solid var(--line); aspect-ratio:16/9; width:100%}
  .viz svg{display:block; width:100%; height:100%}
  .viz.photo{background:var(--plate); display:flex; align-items:center; justify-content:center; overflow:hidden}
  .viz.photo img{display:block; width:100%; height:100%; object-fit:contain; padding:14px; transition:transform .35s ease}
  .viz.photo.cover img{object-fit:cover; padding:0}
  .viz.photo.dark,.sheet-viz.photo.dark{background:#0B1014}
  .card:hover .viz.photo img,.spot:hover .viz.photo img{transform:scale(1.025)}
  .card-body{padding:15px 16px 14px; display:flex; flex-direction:column; gap:9px; flex:1}
  .chips{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
  .badge{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.04em; padding:3px 7px; border-radius:4px; background:var(--accent-wash); color:var(--accent-ink); border:1px solid color-mix(in srgb,var(--accent) 30%, transparent)}
  .tag{font-size:11.5px; color:var(--fg-3); border:1px solid var(--line); padding:2px 7px; border-radius:4px}
  .owner{font-size:11.5px; color:var(--amber); border:1px dashed color-mix(in srgb,var(--amber) 55%, transparent); padding:2px 7px; border-radius:4px}
  .card h4{font-size:16.5px; letter-spacing:-.01em}
  .summary{font-size:13.5px; line-height:1.72; color:var(--fg-2); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
  .mini{margin-top:auto; padding-top:11px; border-top:1px dashed var(--line); display:grid; gap:5px}
  .mini .row{display:flex; justify-content:space-between; gap:14px; font-size:12px; font-variant-numeric:tabular-nums}
  .mini .k{color:var(--fg-3); white-space:nowrap}
  .mini .v{color:var(--fg); text-align:end}
  .more{font-size:12.5px; color:var(--accent); font-weight:500; padding-top:4px}

  .spot{margin-bottom:18px}
  .spot .viz{aspect-ratio:auto; width:55%; border-bottom:0; border-right:1px solid var(--line); min-height:260px}
  .spot-body{padding:26px 28px; display:flex; flex-direction:column; gap:12px; flex:1; min-width:0}
  .spot-body h3{font-size:22px}
  .spot-body .summary{font-size:14.5px; -webkit-line-clamp:4}
  .spot .specs{margin-top:auto; padding-top:16px; border-top:1px dashed var(--line); display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px 18px}
  .spot .specs .k{font-size:12px; color:var(--fg-3)}
  .spot .specs .v{font-size:13.5px; font-variant-numeric:tabular-nums; color:var(--fg); margin-top:1px; line-height:1.55}
  @media (max-width:860px){
    .spot{flex-direction:column}
    .spot .viz{width:100%; aspect-ratio:16/9; min-height:0; border-right:0; border-bottom:1px solid var(--line)}
    .spot-body{padding:20px}
  }

  /* ---------- detail sheet ---------- */
  .sheet[hidden]{display:none!important}
  .sheet{position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; padding:20px}
  .sheet-bg{position:absolute; inset:0; background:rgba(8,16,18,.62); backdrop-filter:blur(3px)}
  .sheet-panel{position:relative; width:min(880px,100%); max-height:min(86vh,940px); overflow:auto; background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:0 24px 70px rgba(6,14,16,.35)}
  .sheet-viz{background:var(--panel); aspect-ratio:21/6; width:100%; border-bottom:1px solid var(--line)}
  .sheet-viz svg{display:block; width:100%; height:100%}
  .sheet-media{position:relative}
  .img-count{position:absolute; right:14px; bottom:12px; font-size:12px; color:var(--fg-2); background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:2px 10px; pointer-events:none}
  .sheet-viz.photo{aspect-ratio:auto; background:var(--plate); display:flex; gap:1px; overflow-x:auto; scroll-snap-type:x mandatory}
  .sheet-viz.photo img{display:block; flex:1 0 100%; width:100%; max-height:min(46vh,420px); object-fit:contain; padding:18px; scroll-snap-align:start}
  .sheet-head{position:sticky; top:0; background:var(--surface); border-bottom:1px solid var(--line-soft); padding:16px 24px; display:flex; align-items:center; gap:14px; z-index:2}
  .sheet-head h3{font-size:19px; flex:1; min-width:0}
  .close{width:30px; height:30px; border-radius:7px; border:1px solid var(--line); color:var(--fg-2); font-size:17px; line-height:1; cursor:pointer; flex:none}
  .close:hover{background:var(--surface-2); color:var(--fg)}
  .sheet-body{padding:20px 24px 30px}
  .specs-table{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); column-gap:28px; background:var(--surface-2); border:1px solid var(--line-soft); border-radius:9px; padding:4px 18px; margin:16px 0 22px}
  .specs-table > div{display:flex; gap:16px; justify-content:space-between; align-items:baseline; padding:10px 0; border-bottom:1px solid var(--line-soft)}
  .specs-table .k{font-size:12.5px; color:var(--fg-3); white-space:nowrap}
  .specs-table .v{font-size:13.5px; font-variant-numeric:tabular-nums; color:var(--fg); text-align:end; line-height:1.55}
  @media (max-width:640px){.specs-table{grid-template-columns:1fr}}
  .doc{font-size:14.5px; color:var(--fg-2)}
  .doc h4{font-size:15px; color:var(--fg); margin:24px 0 8px; padding-left:11px; border-left:2px solid var(--accent)}
  .doc h4:first-child{margin-top:6px}
  .doc p{margin:0 0 12px}
  .doc ul,.doc ol{margin:0 0 14px; padding-left:20px}
  .doc li{margin-bottom:5px}
  .doc strong{color:var(--fg); font-weight:500}
  .doc .tbl{overflow-x:auto; margin:0 0 16px; border:1px solid var(--line-soft); border-radius:9px}
  .doc table{width:100%; border-collapse:collapse; font-size:13px}
  .doc th,.doc td{text-align:left; padding:8px 14px; border-bottom:1px solid var(--line-soft); vertical-align:top}
  .doc tr:last-child td{border-bottom:0}
  .doc th{font-family:var(--font-mono); font-size:11px; font-weight:500; letter-spacing:.04em; color:var(--fg-3); background:var(--surface-2)}
  .doc td:first-child{color:var(--fg-3); white-space:nowrap; width:1%}
  .doc td:last-child{color:var(--fg); font-variant-numeric:tabular-nums}
  .doc code{font-family:var(--font-mono); font-size:.9em; background:var(--surface-2); padding:1px 5px; border-radius:4px}
  @media (max-width:560px){
    .sheet{padding:0; align-items:flex-end}
    .sheet-panel{max-height:92vh; border-radius:14px 14px 0 0}
    .sheet-body{padding:18px 18px 28px}
    .sheet-head{padding:14px 18px}
  }

  /* ---------- footer ---------- */
  .foot{background:var(--nav); color:var(--nav-fg-2); margin-top:60px; padding-block:40px 34px; border-top:1px solid var(--nav-line)}
  .foot .cols{display:grid; grid-template-columns:200px 1fr; gap:34px}
  .foot .doc{color:var(--nav-fg-2); font-size:14px; max-width:70ch}
  .foot .doc strong{color:#fff}
  .foot .doc p{margin-bottom:10px}
  .fine{margin-top:28px; padding-top:16px; border-top:1px solid var(--nav-line); font-family:var(--font-mono); font-size:11.5px; color:#637573; display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap}
  @media (max-width:700px){.foot .cols{grid-template-columns:1fr; gap:20px}}

  .state{padding:60px 0; color:var(--fg-3); font-family:var(--font-mono); font-size:13px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>

      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="1" y="1" width="8" height="8" rx="1.5" fill="#8FE3EE"></rect><rect x="11" y="1" width="8" height="8" rx="1.5" fill="#1B8C9C"></rect><rect x="1" y="11" width="8" height="8" rx="1.5" fill="#1B8C9C"></rect><rect x="11" y="11" width="8" height="8" rx="1.5" fill="#F0B341"></rect></svg>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(function(){
  "use strict";

  /* 内容文件：Tab 顺序即此数组顺序；Tab 名称取自每个文件的一级标题。
     md 里的图片路径（image:）相对于该 md 所在目录。 */
  const SITE = 'content/site.md';
  const TABS = [
    { id:'devices', file:'content/devices/devices.md' },
    { id:'truth',   file:'content/truth/truth.md'     },
    { id:'scenes',  file:'content/scenes/scenes.md'   },
  ];

  const $ = (s, el=document) => el.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  /* ---------- markdown ---------- */
  function md(src){
    if (window.marked && typeof window.marked.parse === 'function') return window.marked.parse(src || '');
    // 极简兜底：CDN 不可用时仍能显示段落、列表、小标题与加粗
    const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>');
    const out = []; let list = null;
    const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
    for (const raw of (src || '').split('\n')){
      const l = raw.trim(); let m;
      if (!l){ close(); continue; }
      if ((m = l.match(/^(#{1,6})\s+(.*)$/))){ close(); const n = Math.min(6, m[1].length); out.push(`<h${n}>${inline(m[2])}</h${n}>`); continue; }
      if ((m = l.match(/^[-*]\s+(.*)$/))){ if (list !== 'ul'){ close(); out.push('<ul>'); list = 'ul'; } out.push(`<li>${inline(m[1])}</li>`); continue; }
      if ((m = l.match(/^\d+\.\s+(.*)$/))){ if (list !== 'ol'){ close(); out.push('<ol>'); list = 'ol'; } out.push(`<li>${inline(m[1])}</li>`); continue; }
      close(); out.push(`<p>${inline(l)}</p>`);
    }
    close(); return out.join('');
  }

  /* 解析约定：
     #   页面标题（= Tab 名）      >   页面导语
     ##  分组                      ### 卡片
     :::meta … ::: 键值块，写在哪一级就归哪一级；spec 可重复，格式「名称 | 数值」 */
  function parseDoc(src){
    const doc = { title:'', tagline:'', meta:{}, introLines:[], sections:[] };
    let sec = null, card = null, inMeta = false;
    const newSec = title => { sec = { title, meta:{}, descLines:[], cards:[] }; doc.sections.push(sec); card = null; };
    for (const line of src.replace(/\r/g,'').split('\n')){
      if (inMeta){
        if (/^:::\s*$/.test(line)){ inMeta = false; continue; }
        const m = line.match(/^\s*([A-Za-z_][\w-]*)\s*:\s*(.*)$/);
        if (m){ const t = card || sec || doc; (t.meta[m[1]] = t.meta[m[1]] || []).push(m[2].trim()); }
        continue;
      }
      if (/^:::meta\s*$/.test(line)){ inMeta = true; continue; }
      let m;
      if ((m = line.match(/^#\s+(.+)$/))){ doc.title = m[1].trim(); continue; }
      if ((m = line.match(/^##\s+(.+)$/))){ newSec(m[1].trim()); continue; }
      if ((m = line.match(/^###\s+(.+)$/))){
        if (!sec) newSec('');
        card = { title:m[1].trim(), meta:{}, bodyLines:[] };
        sec.cards.push(card); continue;
      }
      if (!sec && (m = line.match(/^>\s?(.*)$/))){ doc.tagline += (doc.tagline ? ' ' : '') + m[1].trim(); continue; }
      (card ? card.bodyLines : sec ? sec.descLines : doc.introLines).push(line);
    }
    return doc;
  }

  const one  = (meta, k, d='') => (meta[k] && meta[k][0]) || d;
  const list = (meta, k) => one(meta, k).split('|').map(s => s.trim()).filter(Boolean);
  const specs = meta => (meta.spec || []).map(s => { const i = s.indexOf('|'); return i < 0 ? { k:s, v:'' } : { k:s.slice(0,i).trim(), v:s.slice(i+1).trim() }; });
  const yes = v => /^(yes|true|1|是)$/i.test(v || '');

  function firstPara(lines){
    const out = [];
    for (const l of lines){
      if (!l.trim()){ if (out.length) break; continue; }
      if (/^\s*(#{1,6}\s|[-*]\s|\d+\.\s|>)/.test(l)){ if (out.length) break; continue; }
      out.push(l.trim());
    }
    return out.join(' ').replace(/\*\*(.+?)\*\*/g,'$1');
  }

  /* ---------- 程序化缩略图（按 visual: 选择图元，按标题做随机种子） ---------- */
  const C = { bg:'#0A1214', grid:'#15262A', grid2:'#1D3236', l1:'#4ED8E8', l2:'#1B8C9C', l3:'#F0B341', fog:'#7F9896', ink:'#0A1214' };
  function rng(str){
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
    return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
  }
  const f = n => Math.round(n * 10) / 10;
  function mix(a, b, t){
    const p = x => [1,3,5].map(i => parseInt(x.slice(i, i+2), 16));
    const A = p(a), B = p(b);
    return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2,'0')).join('');
  }
  const ramp = t => t < .5 ? mix(C.l2, C.l1, t * 2) : mix(C.l1, C.l3, (t - .5) * 2);
  function bgGrid(W, H, step=20){
    let s = `<rect width="${W}" height="${H}" fill="${C.bg}"/>`;
    for (let x = step; x < W; x += step) s += `<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="${C.grid}" stroke-width=".6"/>`;
    for (let y = step; y < H; y += step) s += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="${C.grid}" stroke-width=".6"/>`;
    return s;
  }
  const label = (x, y, t, c=C.fog) => `<text x="${x}" y="${y}" fill="${c}" font-family="JetBrains Mono,monospace" font-size="7" letter-spacing=".4">${esc(t)}</text>`;

  const MOTIFS = {
    rig(r, W, H){
      let s = bgGrid(W, H);
      const bx = W * (.24 + r() * .1), by = H - 26;
      s += `<line x1="18" y1="${by}" x2="${W-18}" y2="${by}" stroke="${C.grid2}" stroke-width="1"/>`;
      s += `<path d="M${bx-20} ${by} L${bx-12} ${by-12} L${bx+12} ${by-12} L${bx+20} ${by} Z" fill="${C.l2}" opacity=".55"/>`;
      const lens = [46, 42, 34, 16];
      let a = -Math.PI/2 + (r() - .5) * .5, x = bx, y = by - 12;
      const pts = [[x, y]];
      lens.forEach((L, i) => { a += (i === 0 ? .55 : .5 + r() * .6) * (i % 2 ? 1 : .9); x += Math.cos(a) * L; y += Math.sin(a) * L; pts.push([x, y]); });
      s += `<circle cx="${f(bx)}" cy="${f(by-12)}" r="${lens[0]+lens[1]+lens[2]}" fill="none" stroke="${C.grid2}" stroke-dasharray="2 4"/>`;
      s += `<polyline points="${pts.map(p => f(p[0])+','+f(p[1])).join(' ')}" fill="none" stroke="#D7E3E2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>`;
      pts.slice(0, -1).forEach((p, i) => s += `<circle cx="${f(p[0])}" cy="${f(p[1])}" r="${i ? 4.2 : 5}" fill="${C.ink}" stroke="${C.l1}" stroke-width="2"/>`);
      const [ex, ey] = pts[pts.length-1], ca = Math.cos(a), sa = Math.sin(a), nx = -sa, ny = ca;
      [-1, 1].forEach(k => s += `<line x1="${f(ex+nx*7*k)}" y1="${f(ey+ny*7*k)}" x2="${f(ex+nx*7*k+ca*12)}" y2="${f(ey+ny*7*k+sa*12)}" stroke="${C.l3}" stroke-width="3" stroke-linecap="round"/>`);
      // 末端 TCP 坐标系
      s += `<line x1="${f(ex)}" y1="${f(ey)}" x2="${f(ex+ca*26)}" y2="${f(ey+sa*26)}" stroke="${C.l1}" stroke-width="1.2"/>`;
      s += `<line x1="${f(ex)}" y1="${f(ey)}" x2="${f(ex+nx*20)}" y2="${f(ey+ny*20)}" stroke="${C.l3}" stroke-width="1.2"/>`;
      // 右侧关节曲线
      const gx = W * .64, gw = W * .31;
      for (let k = 0; k < 4; k++){
        const gy = 28 + k * 30, ph = r() * 6, amp = 6 + r() * 5;
        let d = '';
        for (let i = 0; i <= 40; i++){ const t = i / 40; d += (i ? 'L' : 'M') + f(gx + t*gw) + ' ' + f(gy + Math.sin(t*7 + ph) * amp * (0.5 + t*.5)); }
        s += `<path d="${d}" fill="none" stroke="${[C.l1, C.l2, C.l3, C.fog][k]}" stroke-width="1.3"/>`;
        s += label(gx, gy - 11, 'J' + (k+1));
      }
      return s;
    },
    traj(r, W, H){
      let s = `<rect width="${W}" height="${H}" fill="${C.bg}"/>`;
      const vx = W/2, vy = -H*.6;
      for (let i = -8; i <= 8; i++){ const x = W/2 + i * 44; s += `<line x1="${f(vx + (x - vx) * .45)}" y1="${f(H*.28)}" x2="${x}" y2="${H}" stroke="${C.grid}" stroke-width=".7"/>`; }
      [.28, .4, .55, .74, 1].forEach(t => s += `<line x1="0" y1="${f(H*t)}" x2="${W}" y2="${f(H*t)}" stroke="${C.grid}" stroke-width=".7"/>`);
      const P = [[34, H - 30], [W*.3, H*(.2 + r()*.3)], [W*.62, H*(.7 + r()*.2)], [W - 40, 34 + r()*30]];
      const bez = t => { const u = 1 - t; return [0,1].map(j => u*u*u*P[0][j] + 3*u*u*t*P[1][j] + 3*u*t*t*P[2][j] + t*t*t*P[3][j]); };
      s += `<path d="M${P[0]} C${P[1]} ${P[2]} ${P[3]}" fill="none" stroke="${C.l2}" stroke-width="6" opacity=".35"/>`;
      s += `<path d="M${P[0]} C${P[1]} ${P[2]} ${P[3]}" fill="none" stroke="${C.l1}" stroke-width="1.6"/>`;
      for (let i = 1; i < 12; i++){ const [x, y] = bez(i/12); s += `<circle cx="${f(x)}" cy="${f(y)}" r="2.2" fill="${ramp(i/12)}"/>`; }
      s += `<rect x="${P[0][0]-5}" y="${P[0][1]-5}" width="10" height="10" fill="none" stroke="${C.fog}"/>`;
      s += `<circle cx="${f(P[3][0])}" cy="${f(P[3][1])}" r="6" fill="none" stroke="${C.l3}" stroke-width="1.6"/><circle cx="${f(P[3][0])}" cy="${f(P[3][1])}" r="2" fill="${C.l3}"/>`;
      s += label(12, 16, 'odom + arm · world frame') + label(W - 70, H - 10, 't = 0 → 1');
      return s;
    },
    points(r, W, H){
      let s = `<rect width="${W}" height="${H}" fill="${C.bg}"/>`;
      const cx = W * .58, cy = H * .52;
      s += `<path d="M18 ${f(cy)} L${f(cx-70)} ${f(cy-58)} M18 ${f(cy)} L${f(cx-70)} ${f(cy+58)}" stroke="${C.fog}" stroke-width=".7" stroke-dasharray="3 3"/>`;
      s += `<rect x="10" y="${f(cy-7)}" width="14" height="14" fill="none" stroke="${C.l1}" stroke-width="1.2"/>`;
      for (let i = 0; i < 320; i++){
        const u = r() * Math.PI * 2, v = Math.acos(2 * r() - 1), rr = 38 + r() * 14 * (i % 3 ? 1 : 2.2);
        const x = cx + Math.sin(v) * Math.cos(u) * rr * 1.9, z = Math.sin(v) * Math.sin(u), y = cy + Math.cos(v) * rr * .95 + z * 8;
        const t = (z + 1) / 2;
        s += `<circle cx="${f(x)}" cy="${f(y)}" r="${f(.7 + t * 1.2)}" fill="${ramp(t)}" opacity="${f(.35 + t * .6)}"/>`;
      }
      for (let i = 0; i < 90; i++){ const x = 30 + r() * (W - 60), y = H - 14 - r() * 18; s += `<circle cx="${f(x)}" cy="${f(y)}" r=".8" fill="${C.l2}" opacity=".6"/>`; }
      s += label(W - 92, 16, 'pts 1.2M · 5 mm');
      return s;
    },
    depth(r, W, H){
      let s = `<defs><linearGradient id="dg-ramp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E2D36"/><stop offset=".45" stop-color="${C.l2}"/><stop offset=".75" stop-color="${C.l1}"/><stop offset="1" stop-color="${C.l3}"/></linearGradient></defs>`;
      s += `<rect width="${W}" height="${H}" fill="${C.bg}"/>`;
      const bands = 7, pw = W - 40;
      for (let b = 0; b < bands; b++){
        const t = b / (bands - 1), y0 = 10 + t * (H - 30), amp = 6 + r() * 10, ph = r() * 6, fr = 1.5 + r() * 2.5;
        let d = `M0 ${H}`;
        for (let i = 0; i <= 32; i++){ const x = i / 32 * pw; d += ` L${f(x)} ${f(y0 + Math.sin(i / 32 * fr * Math.PI + ph) * amp)}`; }
        d += ` L${pw} ${H} Z`;
        s += `<path d="${d}" fill="${ramp(Math.min(1, t * 1.05))}" opacity="${f(.32 + t * .68)}"/>`;
      }
      // 物体轮廓
      const ox = pw * (.25 + r() * .35), oy = H * .5;
      s += `<rect x="${f(ox)}" y="${f(oy)}" width="${f(46 + r()*30)}" height="${f(34 + r()*18)}" rx="4" fill="${C.l3}" opacity=".85"/>`;
      s += `<rect x="${pw}" y="0" width="40" height="${H}" fill="${C.bg}"/>`;
      s += `<rect x="${pw + 14}" y="14" width="8" height="${H - 28}" fill="url(#dg-ramp)"/>`;
      ['0.3', '1.2', '2.6 m'].forEach((t, i) => s += label(pw + 3, 12 + i * (H - 22) / 2 + (i === 2 ? 0 : 6), t));
      return s;
    },
    mask(r, W, H){
      let s = bgGrid(W, H, 24);
      const cols = [C.l1, C.l3, C.l2, '#A7E3C8'];
      for (let k = 0; k < 4; k++){
        const cx = W * (.16 + k * .22 + (r() - .5) * .06), cy = H * (.4 + r() * .3), R = 20 + r() * 20, n = 7;
        const pts = Array.from({ length:n }, (_, i) => { const a = i / n * Math.PI * 2, rr = R * (.72 + r() * .45); return [cx + Math.cos(a) * rr * 1.2, cy + Math.sin(a) * rr]; });
        let d = '';
        pts.forEach((p, i) => { const q = pts[(i + 1) % n], m = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2]; d += (i ? ' Q' : 'M' + f((pts[n-1][0] + p[0]) / 2) + ' ' + f((pts[n-1][1] + p[1]) / 2) + ' Q') + f(p[0]) + ' ' + f(p[1]) + ' ' + f(m[0]) + ' ' + f(m[1]); });
        s += `<path d="${d} Z" fill="${cols[k]}" fill-opacity=".22" stroke="${cols[k]}" stroke-width="1.4"/>`;
        const lx = f(cx - R), ly = f(cy - R - 14);
        s += `<rect x="${lx}" y="${ly}" width="34" height="11" rx="2" fill="${cols[k]}"/>` + label(+lx + 4, +ly + 8, 'id ' + String(3 + k * 4).padStart(2, '0'), C.ink);
      }
      s += label(12, H - 10, 'instance · tracked');
      return s;
    },
    grid(r, W, H){
      let s = `<rect width="${W}" height="${H}" fill="${C.bg}"/>`;
      const nx = 7, ny = 5, skew = .18 + r() * .14;
      const P = (u, v) => { const top = 30 + v * (H - 70), sc = .62 + v * .38, x0 = W / 2 - (W * .56 * sc) / 2 + (1 - v) * W * skew * .3; return [x0 + u * W * .56 * sc, top]; };
      for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++){
        const a = P(i/nx, j/ny), b = P((i+1)/nx, j/ny), c = P((i+1)/nx, (j+1)/ny), d = P(i/nx, (j+1)/ny);
        s += `<path d="M${a.map(f)} L${b.map(f)} L${c.map(f)} L${d.map(f)} Z" fill="${(i + j) % 2 ? '#D7E3E2' : C.bg}" fill-opacity="${(i + j) % 2 ? .82 : 1}" stroke="${C.grid2}" stroke-width=".5"/>`;
      }
      for (let j = 1; j < ny; j++) for (let i = 1; i < nx; i++){ if (r() < .45) continue; const [x, y] = P(i/nx, j/ny); s += `<circle cx="${f(x)}" cy="${f(y)}" r="2.2" fill="none" stroke="${C.l3}" stroke-width="1"/>`; }
      [[16, 14], [W - 16, 14], [16, H - 14], [W - 16, H - 14]].forEach(([x, y]) => { const dx = x < W / 2 ? 1 : -1, dy = y < H / 2 ? 1 : -1; s += `<path d="M${x} ${y + dy*12} L${x} ${y} L${x + dx*12} ${y}" fill="none" stroke="${C.l1}" stroke-width="1.4"/>`; });
      s += label(24, H - 20, 'reproj err 0.21 px');
      return s;
    },
    plan(r, W, H){
      let s = bgGrid(W, H, 16);
      const x0 = 22, y0 = 18, w = W - 44, h = H - 36;
      s += `<rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="none" stroke="#D7E3E2" stroke-width="2.2"/>`;
      const sx = x0 + w * (.34 + r() * .16), sy = y0 + h * (.45 + r() * .15), sx2 = sx + w * (.24 + r() * .1);
      s += `<line x1="${f(sx)}" y1="${y0}" x2="${f(sx)}" y2="${f(sy - 16)}" stroke="#D7E3E2" stroke-width="1.6"/>`;
      s += `<line x1="${f(sx)}" y1="${f(sy + 16)}" x2="${f(sx)}" y2="${y0 + h}" stroke="#D7E3E2" stroke-width="1.6"/>`;
      s += `<line x1="${f(sx)}" y1="${f(sy)}" x2="${f(sx2 - 18)}" y2="${f(sy)}" stroke="#D7E3E2" stroke-width="1.6"/>`;
      s += `<line x1="${f(sx2 + 18)}" y1="${f(sy)}" x2="${x0 + w}" y2="${f(sy)}" stroke="#D7E3E2" stroke-width="1.6"/>`;
      s += `<line x1="${f(sx2)}" y1="${y0}" x2="${f(sx2)}" y2="${f(sy)}" stroke="#D7E3E2" stroke-width="1.6"/>`;
      const zones = [[x0 + 8, y0 + 8, sx - x0 - 16, sy - y0 - 24], [x0 + 8, sy + 24, sx - x0 - 16, y0 + h - sy - 32], [sx + 8, y0 + 8, sx2 - sx - 16, sy - y0 - 16], [sx2 + 8, y0 + 8, x0 + w - sx2 - 16, sy - y0 - 16], [sx + 8, sy + 8, x0 + w - sx - 16, y0 + h - sy - 16]];
      const stations = [];
      zones.forEach((z, zi) => {
        const n = 1 + Math.floor(r() * 3);
        for (let k = 0; k < n; k++){
          const fw = 14 + r() * 26, fh = 10 + r() * 16, fx = z[0] + r() * Math.max(1, z[2] - fw), fy = z[1] + r() * Math.max(1, z[3] - fh);
          s += `<rect x="${f(fx)}" y="${f(fy)}" width="${f(fw)}" height="${f(fh)}" rx="1.5" fill="${C.l2}" fill-opacity=".28" stroke="${C.l2}" stroke-width=".8"/>`;
          if (k === 0) stations.push([fx + fw / 2, fy + fh / 2, zi]);
        }
      });
      const path = [[x0 + 14, y0 + h - 12], ...stations.map(p => [p[0], p[1]])];
      s += `<polyline points="${path.map(p => f(p[0]) + ',' + f(p[1])).join(' ')}" fill="none" stroke="${C.l1}" stroke-width="1.3" stroke-dasharray="4 3"/>`;
      stations.forEach((p, i) => { s += `<circle cx="${f(p[0])}" cy="${f(p[1])}" r="7" fill="${C.bg}" stroke="${C.l3}" stroke-width="1.3"/>` + `<text x="${f(p[0])}" y="${f(p[1] + 2.6)}" text-anchor="middle" fill="${C.l3}" font-family="JetBrains Mono,monospace" font-size="7">${i + 1}</text>`; });
      return s;
    },
    chart(r, W, H){
      let s = bgGrid(W, H, 20);
      const x0 = 46, x1 = W - 16, rows = ['task', 'sub', 'act', 'grip'], cols = [C.l1, C.l2, C.l3, C.fog];
      rows.forEach((name, k) => {
        const y = 22 + k * 30;
        s += label(12, y + 10, name);
        let x = x0;
        while (x < x1 - 8){
          const len = Math.min(x1 - x, (k === 0 ? 200 : k === 1 ? 60 : 18) + r() * (k === 0 ? 80 : k === 1 ? 50 : 30));
          s += `<rect x="${f(x)}" y="${y}" width="${f(len - 3)}" height="14" rx="2" fill="${cols[k]}" fill-opacity="${k === 3 ? (r() < .5 ? .9 : .2) : f(.35 + r() * .55)}"/>`;
          x += len;
        }
      });
      const by = H - 14;
      for (let i = 0; i < 26; i++){ const bh = 8 + r() * 30, x = x0 + i * ((x1 - x0) / 26); s += `<rect x="${f(x)}" y="${f(by - bh)}" width="${f((x1 - x0) / 26 - 3)}" height="${f(bh)}" fill="${bh > 32 ? C.l3 : C.l2}" opacity=".85"/>`; }
      s += `<line x1="${x0}" y1="${by}" x2="${x1}" y2="${by}" stroke="${C.fog}" stroke-width=".7"/>`;
      return s;
    },
  };

  function viz(kind, seed, W=320, H=180){
    const fn = MOTIFS[kind] || MOTIFS.grid;
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">${fn(rng(seed + kind), W, H)}</svg>`;
  }

  // 有 image: 用产品图，否则用程序化缩略图
  function visual(c, W, H){
    return c.images.length
      ? `<img src="${esc(c.images[0])}" alt="${esc(c.title)}" loading="lazy" decoding="async">`
      : viz(c.visual, c.title, W, H);
  }
  const vizClass = c => 'viz' + (c.images.length ? ' photo' + (one(c.meta, 'fit') === 'cover' ? ' cover' : '') + (one(c.meta, 'plate') === 'dark' ? ' dark' : '') : '');
  const resolve = (base, p) => /^(https?:|data:|\/)/.test(p) ? p : base + p.replace(/^\.\//, '');

  /* ---------- 渲染 ---------- */
  const state = { site:null, tabs:[], cards:new Map(), active:null, lastTrigger:null };

  function chipsHTML(meta){
    const b = one(meta, 'badge');
    const o = one(meta, 'owner');
    return `<div class="chips">${b ? `<span class="badge">${esc(b)}</span>` : ''}${list(meta, 'tags').map(t => `<span class="tag">${esc(t)}</span>`).join('')}${o ? `<span class="owner">撰写 · ${esc(o)}</span>` : ''}</div>`;
  }

  function cardHTML(tab, c){
    const sp = specs(c.meta).slice(0, 2);
    return `<button class="card" type="button" data-open="${esc(tab.id)}/${esc(c.id)}">
      <div class="${vizClass(c)}">${visual(c)}</div>
      <div class="card-body">
        ${chipsHTML(c.meta)}
        <h4>${esc(c.title)}</h4>
        <p class="summary">${esc(c.summary)}</p>
        <div class="mini">${sp.map(x => `<div class="row"><span class="k">${esc(x.k)}</span><span class="v">${esc(x.v)}</span></div>`).join('')}<span class="more">查看详情 →</span></div>
      </div>
    </button>`;
  }

  function spotHTML(tab, c){
    return `<button class="spot" type="button" data-open="${esc(tab.id)}/${esc(c.id)}">
      <div class="${vizClass(c)}">${visual(c, 360, 240)}</div>
      <div class="spot-body">
        ${chipsHTML(c.meta)}
        <h3>${esc(c.title)}</h3>
        <p class="summary">${esc(c.summary)}</p>
        <div class="specs">${specs(c.meta).map(x => `<div><div class="k">${esc(x.k)}</div><div class="v">${esc(x.v)}</div></div>`).join('')}</div>
        <span class="more">查看详情 →</span>
      </div>
    </button>`;
  }

  function panelHTML(tab){
    const d = tab.doc;
    const secs = d.sections.map(sec => {
      const spot = sec.cards.filter(c => yes(one(c.meta, 'spotlight')));
      const rest = sec.cards.filter(c => !spot.includes(c));
      const desc = sec.descLines.join('\n').trim();
      return `<section class="section">
        <div class="sec-head"><h3>${esc(sec.title)}</h3><span class="rule"></span><span class="count">${sec.cards.length} 项</span></div>
        ${desc ? `<div class="sec-desc">${md(desc)}</div>` : ''}
        ${spot.map(c => spotHTML(tab, c)).join('')}
        ${rest.length ? `<div class="grid${rest.length % 3 !== 0 && rest.length % 2 === 0 ? ' even' : ''}">${rest.map(c => cardHTML(tab, c)).join('')}</div>` : ''}
      </section>`;
    }).join('');
    const intro = d.introLines.join('\n').trim();
    return `<div class="wrap" role="tabpanel" id="panel-${tab.id}" aria-labelledby="tab-${tab.id}">
      <div class="intro">
        <div class="eyebrow">${esc(one(d.meta, 'eyebrow', tab.id))}</div>
        <h2>${esc(d.title)}</h2>
        ${d.tagline ? `<p class="lead">${esc(d.tagline)}</p>` : ''}
        ${intro ? `<div class="lead doc">${md(intro)}</div>` : ''}
      </div>
      ${secs}
    </div>`;
  }

  function renderShell(){
    const s = state.site;
    const statSec = s.sections.find(x => x.title === '指标');
    const footSec = s.sections.find(x => x.title === '页脚');
    const stats = (statSec ? statSec.descLines : []).map(l => l.match(/^\s*[-*]\s+(.+?)\s*\|\s*(.+)$/)).filter(Boolean).map(m => {
      const v = m[2].trim().match(/^([\d.,+%×x~–-]+)\s*(.*)$/);
      return { k:m[1], num:v ? v[1] : m[2].trim(), unit:v ? v[2] : '' };
    });
    $('#masthead').innerHTML = `<div class="wrap">
      <div class="eyebrow">${esc(s.title)} · Embodied Data Engine</div>
      <h1>${esc(s.tagline)}</h1>
      <div class="lead doc" style="color:inherit">${md(s.introLines.join('\n').trim())}</div>
      <div class="stats">${stats.map(x => `<div class="stat"><div class="v">${esc(x.num)}${x.unit ? `<em>${esc(x.unit)}</em>` : ''}</div><div class="k">${esc(x.k)}</div></div>`).join('')}</div>
    </div>`;
    $('#masthead .lead').style.color = '';
    $('#foot').innerHTML = `<div class="wrap">
      <div class="cols">
        <div class="brand" style="align-self:start">${esc(s.title)}</div>
        <div class="doc">${footSec ? md(footSec.descLines.join('\n').trim()) : ''}</div>
      </div>
      <div class="fine"><span>${esc(s.title)} · ${esc(s.tagline)}</span><span>示例站点 · 内容由 content/*.md 驱动</span></div>
    </div>`;
    $('#tabs').innerHTML = state.tabs.map(t => `<a class="tab" role="tab" id="tab-${t.id}" href="#/${t.id}" aria-controls="panel-${t.id}" aria-selected="false">${esc(t.doc.title)}</a>`).join('');
  }

  function showTab(id){
    const tab = state.tabs.find(t => t.id === id) || state.tabs[0];
    if (state.active !== tab.id){
      state.active = tab.id;
      $('#main').innerHTML = panelHTML(tab);
      window.scrollTo({ top:0 });
    }
    document.querySelectorAll('.tab').forEach(a => a.setAttribute('aria-selected', a.id === 'tab-' + tab.id ? 'true' : 'false'));
    document.title = `${tab.doc.title} · DataGrid 数据生产引擎`;
    return tab;
  }

  function openSheet(tab, c){
    const sv = $('#sheet-viz');
    sv.className = 'sheet-viz' + (c.images.length ? ' photo' + (one(c.meta, 'plate') === 'dark' ? ' dark' : '') : '');
    sv.innerHTML = c.images.length
      ? c.images.map(src => `<img src="${esc(src)}" alt="${esc(c.title)}">`).join('')
      : viz(c.visual, c.title, 840, 240);
    const ic = $('#img-count');
    ic.hidden = c.images.length < 2;
    ic.textContent = `${c.images.length} 张图 · 左右滑动`;
    $('#sheet-title').textContent = c.title;
    const sp = specs(c.meta);
    $('#sheet-body').innerHTML = `${chipsHTML(c.meta)}
      ${sp.length ? `<div class="specs-table">${sp.map(x => `<div><div class="k">${esc(x.k)}</div><div class="v">${esc(x.v)}</div></div>`).join('')}</div>` : ''}
      <div class="doc">${md(c.body).replace(/<table>/g, '<div class="tbl"><table>').replace(/<\/table>/g, '</table></div>')}</div>`;
    const sheet = $('#sheet');
    if (sheet.hidden){ sheet.hidden = false; document.body.style.overflow = 'hidden'; }
    $('.sheet-panel').scrollTop = 0;
    $('#sheet-close').focus();
  }
  function closeSheet(){
    const sheet = $('#sheet');
    if (sheet.hidden) return;
    sheet.hidden = true; document.body.style.overflow = '';
    if (state.lastTrigger && document.contains(state.lastTrigger)) state.lastTrigger.focus();
  }

  function route(){
    const parts = decodeURIComponent(location.hash.replace(/^#\/?/, '')).split('/').filter(Boolean);
    const tab = showTab(parts[0]);
    const c = parts[1] && state.cards.get(tab.id + '/' + parts[1]);
    if (c) openSheet(tab, c); else closeSheet();
  }

  document.addEventListener('click', e => {
    const opener = e.target.closest('[data-open]');
    if (opener){ state.lastTrigger = opener; location.hash = '#/' + opener.dataset.open; return; }
    if (e.target.closest('[data-close]') || e.target.closest('#sheet-close')) location.hash = '#/' + state.active;
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) location.hash = '#/' + state.active; });
  window.addEventListener('hashchange', route);

  async function load(path){
    const res = await fetch(path, { cache:'no-cache' });
    if (!res.ok) throw new Error(`${path} 返回 ${res.status}`);
    return res.text();
  }

  async function boot(){
    try{
      const [site, ...docs] = await Promise.all([load(SITE), ...TABS.map(t => load(t.file))]);
      state.site = parseDoc(site);
      state.tabs = TABS.map((t, i) => {
        const doc = parseDoc(docs[i]);
        doc.sections.forEach(sec => sec.cards.forEach((c, j) => {
          c.id = one(c.meta, 'id', `${sec.title}-${j + 1}`);
          c.visual = one(c.meta, 'visual', 'grid');
          c.images = (c.meta.image || []).map(x => resolve(t.file.replace(/[^/]*$/, ''), x));
          c.summary = firstPara(c.bodyLines);
          c.body = c.bodyLines.join('\n').trim();
          state.cards.set(t.id + '/' + c.id, c);
        }));
        return { ...t, doc };
      });
      renderShell();
      route();
    } catch (err){
      const local = location.protocol === 'file:';
      $('#main').innerHTML = `<div class="wrap"><div class="state">
        <p>内容文件没有读到：${esc(err.message)}</p>
        <p style="margin-top:8px">${local
          ? '直接双击打开 index.html 时，浏览器会禁止页面读取本地 .md 文件。请在项目目录运行 <code>python3 -m http.server 8000</code>，然后访问 http://localhost:8000'
          : '请确认 content/ 目录与 index.html 一起发布，且文件名与页面脚本中的 TABS 配置一致。'}</p>
      </div></div>`;
    }
  }
  boot();
})();
</script>
